<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piazza delle Parole — Impara l'Italiano</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2B2115;
    --cobalt:#1E9BC9;
    --cobalt-deep:#0F6E8F;
    --lemon:#FFC93C;
    --coral:#FF6B5B;
    --basil:#4FAE5D;
    --paper:#FFFDF7;
    --paper-line:#F0E4C8;
    --paper-shadow: rgba(43,33,21,0.14);
    --bg-deep:#FFF7E6;
    --bg-deep-2:#FFF0D6;
    --text-onDark:#2B2115;
    --text-onDark-muted:#8A7C60;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'DM Sans', sans-serif;
    background:
      radial-gradient(circle at 10% 5%, rgba(255,201,60,0.25), transparent 42%),
      radial-gradient(circle at 92% 15%, rgba(30,155,201,0.16), transparent 40%),
      radial-gradient(circle at 85% 95%, rgba(255,107,91,0.15), transparent 45%),
      var(--bg-deep);
    color:var(--text-onDark);
    min-height:100vh;
  }
  .wrap{max-width:760px; margin:0 auto; padding:28px 20px 80px;}

  /* Header */
  header{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-bottom:24px; flex-wrap:wrap; padding-bottom:20px; border-bottom:3px solid var(--lemon);}
  .brand{display:flex; flex-direction:column;}
  .brand .eyebrow{font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--coral); font-weight:700;}
  .brand h1{font-family:'Fraunces', serif; font-weight:700; font-size:clamp(28px,5vw,40px); margin:4px 0 0; color:var(--ink);}
  .brand .tagline{font-family:'Fraunces', serif; font-style:italic; font-size:14px; color:var(--text-onDark-muted); margin:6px 0 0; max-width:340px;}
  .stats{display:flex; gap:14px; font-family:'JetBrains Mono', monospace;}
  .stat{background:var(--ink); color:var(--paper); border-radius:10px; padding:8px 12px; text-align:center; min-width:64px;}
  .stat .n{font-size:18px; font-weight:600; line-height:1.1; color:var(--lemon);}
  .stat .l{font-size:9px; letter-spacing:.08em; text-transform:uppercase; opacity:.75;}

  /* Tabs */
  nav.tabs{
    display:flex; gap:4px; margin-bottom:22px; flex-wrap:wrap;
    background:var(--paper); border:2.5px solid var(--ink); border-radius:16px; padding:6px;
    box-shadow:5px 5px 0 var(--lemon);
  }
  nav.tabs button{
    font-family:'DM Sans', sans-serif; font-weight:700; font-size:13px;
    background:none; border:none; padding:9px 13px; border-radius:10px;
    color:var(--ink); cursor:pointer; border-bottom:none;
    transition:color .15s ease, background .15s ease;
  }
  nav.tabs button:hover{color:var(--cobalt-deep); background:rgba(30,155,201,0.08);}
  nav.tabs button.active{color:#fff; background:var(--cobalt);}
  nav.tabs button:focus-visible{outline:2px solid var(--cobalt); outline-offset:2px; border-radius:6px;}

  /* Category chips (used for reading passage picker) */
  .cats{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:24px;}
  .chip{
    font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:600;
    border:1.5px solid var(--paper-line); background:#fff; color:var(--ink);
    border-radius:999px; padding:7px 14px; cursor:pointer; letter-spacing:.02em;
    transition:all .15s ease;
  }
  .chip:hover{border-color:var(--cobalt);}
  .chip.active{background:var(--cobalt); border-color:var(--cobalt); color:#fff;}
  .chip:focus-visible{outline:2px solid var(--cobalt); outline-offset:2px;}

  /* Category tiles — one color per "stall" */
  .cat-tile{
    --tile-color:var(--cobalt);
    display:inline-flex; align-items:center; gap:8px;
    font-family:'DM Sans', sans-serif; font-size:13.5px; font-weight:700;
    background:#fff; border:2.5px solid var(--tile-color); color:var(--ink);
    border-radius:14px; padding:10px 16px 10px 12px; cursor:pointer;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease, color .12s ease;
  }
  .cat-tile-icon{font-size:18px; line-height:1;}
  .cat-tile:hover{transform:translateY(-2px); box-shadow:3px 3px 0 var(--tile-color);}
  .cat-tile.active{background:var(--tile-color); color:#fff; box-shadow:3px 3px 0 var(--ink);}
  .cat-tile:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}

  main{min-height:380px;}

  /* Flashcard */
  .flash-stage{display:flex; flex-direction:column; align-items:center; gap:18px;}
  .card{
    width:100%; max-width:420px; aspect-ratio:4/3; perspective:1400px; cursor:pointer;
  }
  .card-inner{
    position:relative; width:100%; height:100%; transition:transform .5s cubic-bezier(.2,.8,.2,1);
    transform-style:preserve-3d;
  }
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .face{
    position:absolute; inset:0; backface-visibility:hidden; border-radius:18px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
    padding:24px; box-shadow:0 10px 30px var(--paper-shadow); border:2px solid var(--paper-line);
  }
  .face.front{background:#fff; color:var(--ink);}
  .face.back{background:var(--cobalt-deep); color:var(--paper); transform:rotateY(180deg);}
  .face .emoji{font-size:56px; margin-bottom:10px;}
  .face .word{font-family:'Fraunces', serif; font-weight:700; font-size:clamp(26px,5vw,36px); color:var(--ink);}
  .face.back .word{color:#fff;}
  .face .sub{font-family:'JetBrains Mono', monospace; font-size:12px; opacity:.6; margin-top:8px;}
  .face .sentence{font-style:italic; font-size:14px; margin-top:14px; opacity:.9; max-width:320px;}
  .hint{font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text-onDark-muted); letter-spacing:.05em;}

  .flash-controls{display:flex; gap:10px;}
  .btn{
    font-family:'DM Sans', sans-serif; font-weight:700; font-size:14px; border-radius:10px;
    padding:11px 18px; border:none; cursor:pointer; transition:transform .1s ease, box-shadow .15s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}
  .btn-ghost{background:#fff; border:1.5px solid var(--paper-line); color:var(--ink);}
  .btn-ghost:hover{border-color:var(--cobalt);}
  .btn-coral{background:var(--coral); color:#fff;}
  .btn-basil{background:var(--basil); color:#fff;}
  .btn-ink{background:var(--ink); color:var(--paper);}
  .btn-lemon{background:var(--lemon); color:var(--ink);}
  .btn[disabled]{opacity:.5; cursor:not-allowed;}

  /* Quiz */
  .quiz-box{background:#fff; border:2px solid var(--paper-line); border-radius:18px; padding:28px; box-shadow:0 10px 30px var(--paper-shadow); color:var(--ink);}
  .quiz-prompt{font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--coral); font-weight:600; margin-bottom:6px;}
  .quiz-word{font-family:'Fraunces', serif; font-weight:700; font-size:clamp(28px,5vw,38px); margin-bottom:22px; color:var(--ink);}
  .options{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media(max-width:480px){.options{grid-template-columns:1fr;}}
  .opt{
    font-family:'DM Sans', sans-serif; font-size:15px; font-weight:500; text-align:left;
    background:var(--paper); border:2px solid var(--paper-line); border-radius:12px; padding:14px 16px;
    cursor:pointer; transition:all .12s ease;
  }
  .opt:hover:not([disabled]){border-color:var(--cobalt); background:#fff;}
  .opt:focus-visible{outline:2px solid var(--cobalt); outline-offset:2px;}
  .opt.correct{background:var(--basil); border-color:var(--basil); color:#fff;}
  .opt.wrong{background:var(--coral); border-color:var(--coral); color:#fff;}
  .opt[disabled]{cursor:default;}
  .feedback-row{display:flex; justify-content:space-between; align-items:center; margin-top:20px;}
  .streak-badge{font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--cobalt); font-weight:600;}

  /* Speed round */
  .timer-wrap{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px;}
  .timer-bar{flex:1; height:8px; background:var(--paper-line); border-radius:99px; margin:0 14px; overflow:hidden;}
  .timer-fill{height:100%; background:var(--coral); width:100%; transition:width 1s linear;}
  .timer-num{font-family:'JetBrains Mono', monospace; font-weight:700; font-size:15px; min-width:34px; text-align:right;}
  .speed-score{font-family:'JetBrains Mono', monospace; font-weight:600; font-size:14px;}
  .start-screen{text-align:center; padding:40px 20px;}
  .start-screen h2{font-family:'Fraunces', serif; font-size:26px; margin-bottom:8px;}
  .start-screen p{color:var(--text-onDark-muted); margin-bottom:22px; font-size:14px;}
  .results{text-align:center; padding:30px 20px;}
  .results .big{font-family:'Fraunces', serif; font-size:44px; font-weight:700; color:var(--cobalt);}

  /* Passport / progress */
  .passport{background:var(--ink); border-radius:20px; padding:28px; color:var(--paper); box-shadow:0 14px 34px var(--paper-shadow);}
  .passport-head{display:flex; justify-content:space-between; align-items:flex-start; border-bottom:1px dashed rgba(250,246,239,.3); padding-bottom:16px; margin-bottom:18px;}
  .passport-head .pt{font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; opacity:.6;}
  .passport-head h2{font-family:'Fraunces', serif; font-size:26px; margin:2px 0 0;}
  .stamps-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:16px;}
  .stamp-cell{border:1.5px dashed rgba(250,246,239,.35); border-radius:14px; padding:18px 10px; text-align:center; position:relative; min-height:120px; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .stamp-cell .cat-name{font-family:'DM Sans', sans-serif; font-weight:700; font-size:13px; margin-bottom:8px;}
  .stamp-cell .progress-txt{font-family:'JetBrains Mono', monospace; font-size:11px; opacity:.6;}
  .stamp{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:12px; letter-spacing:.06em;
    border:3px solid var(--coral); color:var(--coral); border-radius:50%;
    width:78px; height:78px; display:flex; align-items:center; justify-content:center; text-align:center;
    transform:rotate(-11deg); opacity:0; line-height:1.15;
  }
  .stamp-cell.earned .stamp{opacity:1; animation:stamp-in .35s ease-out;}
  .stamp-cell.earned .progress-txt{display:none;}
  @keyframes stamp-in{from{transform:rotate(-11deg) scale(1.8); opacity:0;} to{transform:rotate(-11deg) scale(1); opacity:1;}}
  .mini-emoji{font-size:26px; margin-bottom:4px;}

  /* Reading / Lettura */
  .passage-picker{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .reading-card{background:#fff; border:2px solid var(--paper-line); border-radius:18px; padding:26px; box-shadow:0 10px 30px var(--paper-shadow); color:var(--ink);}
  .reading-title{font-family:'Fraunces', serif; font-weight:700; font-size:24px; margin-bottom:2px; color:var(--ink);}
  .reading-sub{font-family:'JetBrains Mono', monospace; font-size:11px; color:#8b8577; margin-bottom:6px;}
  .reading-hint{font-size:12px; color:#8b8577; margin-bottom:20px;}
  .rline{margin-bottom:16px;}
  .it-line-wrap{display:flex; flex-wrap:wrap; align-items:flex-start; row-gap:12px; margin-bottom:6px;}
  .word-stack{display:inline-flex; flex-direction:column; align-items:flex-start; margin:0 12px 0 0;}
  .word-stack .wit{font-family:'Fraunces', serif; font-weight:600; font-size:19px; line-height:1.3; color:var(--ink);}
  .word-stack .wgloss{font-family:'JetBrains Mono', monospace; font-size:10.5px; color:var(--coral); font-weight:600; margin-top:2px; letter-spacing:.01em;}
  .rline-controls{display:flex; gap:8px; align-items:center; margin-bottom:10px;}
  .rline{padding:10px; border-radius:12px; transition:background .2s ease;}
  .rline.playing{background:rgba(255,201,60,0.18);}
  .translate-toggle{
    margin-top:4px; background:none; border:1px dashed var(--paper-line); border-radius:8px;
    padding:5px 11px; font-family:'JetBrains Mono', monospace; font-size:11px; cursor:pointer;
    color:var(--cobalt); font-weight:600;
  }
  .translate-toggle:hover{border-color:var(--cobalt);}
  .en-line{margin-top:8px; font-style:italic; color:#6b6558; font-size:14px; padding:9px 13px; background:var(--paper); border-left:3px solid var(--lemon); border-radius:6px;}
  .en-line.hidden{display:none;}
  .reading-footer{display:flex; justify-content:space-between; align-items:center; margin-top:22px; padding-top:18px; border-top:1px solid var(--paper-line); flex-wrap:wrap; gap:10px;}
  .reading-footer .done-note{font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--basil); font-weight:600;}

  footer.credit{text-align:center; margin-top:36px; font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text-onDark-muted); opacity:.7;}

  /* Grammar */
  .gram-card{background:#fff; border:2px solid var(--paper-line); border-radius:14px; margin-bottom:14px; overflow:hidden; box-shadow:0 6px 18px var(--paper-shadow); color:var(--ink);}
  .gram-card summary{
    cursor:pointer; font-family:'Fraunces', serif; font-weight:700; font-size:18px;
    padding:16px 20px; list-style:none; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .gram-card summary::-webkit-details-marker{display:none;}
  .gram-card summary .plus{font-family:'JetBrains Mono', monospace; font-size:20px; color:var(--cobalt); flex-shrink:0;}
  .gram-card[open] summary .plus{transform:rotate(45deg); display:inline-block;}
  .gram-card summary:focus-visible{outline:2px solid var(--cobalt); outline-offset:-2px;}
  .gram-body{padding:0 20px 22px; font-size:14.5px; line-height:1.75; color:var(--ink);}
  .gram-table{width:100%; border-collapse:collapse; margin:12px 0; font-family:'JetBrains Mono', monospace; font-size:13px;}
  .gram-table th, .gram-table td{text-align:left; padding:7px 10px; border-bottom:1px solid var(--paper-line);}
  .gram-table th{color:var(--coral); font-weight:700; text-transform:uppercase; font-size:10.5px; letter-spacing:.05em;}
  .gram-rule{background:var(--paper); border-left:3px solid var(--lemon); border-radius:6px; padding:11px 15px; margin:12px 0; font-size:13.5px;}
  .gram-eg{color:#6b6558; font-style:italic; font-size:13.5px;}

  /* Sentence builder */
  .builder-card{background:#fff; border:2px solid var(--paper-line); border-radius:18px; padding:28px; box-shadow:0 10px 30px var(--paper-shadow); color:var(--ink);}
  .builder-prompt{font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--coral); font-weight:600; margin-bottom:6px;}
  .builder-en{font-family:'Fraunces', serif; font-weight:700; font-size:clamp(22px,4.5vw,28px); margin-bottom:22px; color:var(--ink);}
  .builder-built{
    min-height:56px; border:2px dashed var(--paper-line); border-radius:12px; padding:12px;
    display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:18px; background:var(--paper);
  }
  .builder-built.correct{border-color:var(--basil); background:rgba(79,174,93,0.12);}
  .builder-built.wrong{border-color:var(--coral); background:rgba(255,107,91,0.12);}
  .builder-built .placeholder{font-family:'JetBrains Mono', monospace; font-size:12px; color:#a49d8c;}
  .word-chip{
    font-family:'DM Sans', sans-serif; font-weight:600; font-size:14px; background:var(--cobalt); color:#fff;
    border:none; border-radius:8px; padding:8px 12px; cursor:pointer;
  }
  .builder-bank{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:22px;}
  .bank-chip{
    font-family:'DM Sans', sans-serif; font-weight:600; font-size:14px; background:#fff; color:var(--ink);
    border:2px solid var(--paper-line); border-radius:8px; padding:8px 12px; cursor:pointer; transition:all .12s ease;
  }
  .bank-chip:hover:not([disabled]){border-color:var(--cobalt);}
  .bank-chip[disabled]{opacity:.25; cursor:default;}
  .builder-actions{display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;}
  .builder-msg{font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:600; min-height:18px;}
  .builder-msg.ok{color:var(--basil);}
  .builder-msg.bad{color:var(--coral);}

  /* Writing / Scrittura */
  .write-subnav{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;}
  .write-subnav button{
    font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:600;
    border:1.5px solid var(--paper-line); background:#fff; color:var(--ink);
    border-radius:999px; padding:7px 14px; cursor:pointer; letter-spacing:.02em;
  }
  .write-subnav button.active{background:var(--ink); border-color:var(--ink); color:var(--paper);}
  .write-subnav button:focus-visible{outline:2px solid var(--cobalt); outline-offset:2px;}

  .write-card{background:#fff; border:2px solid var(--paper-line); border-radius:18px; padding:28px; box-shadow:0 10px 30px var(--paper-shadow); color:var(--ink);}
  .write-prompt{font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--coral); font-weight:600; margin-bottom:6px;}
  .write-target{font-family:'Fraunces', serif; font-weight:700; font-size:clamp(24px,5vw,32px); margin-bottom:18px; color:var(--ink);}
  .write-input{
    font-family:'DM Sans', sans-serif; font-size:18px; padding:13px 16px; width:100%;
    border:2px solid var(--paper-line); border-radius:10px; outline:none; background:var(--paper); color:var(--ink);
    transition:border-color .12s ease;
  }
  .write-input:focus{border-color:var(--cobalt);}
  .write-input.ok-so-far{border-color:var(--basil);}
  .write-input.bad-so-far{border-color:var(--coral);}
  .write-row{display:flex; gap:10px; margin-bottom:14px; align-items:center;}
  .write-row .write-input{flex:1;}
  .mastery-dots{display:flex; gap:5px; margin-bottom:16px;}
  .mastery-dots span{width:10px; height:10px; border-radius:50%; background:var(--paper-line); display:inline-block;}
  .mastery-dots span.filled{background:var(--basil);}
  .write-progress{font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--text-onDark-muted); margin-bottom:16px;}
  .write-feedback{font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:600; min-height:20px; margin-bottom:10px;}
  .write-feedback.ok{color:var(--basil);}
  .write-feedback.bad{color:var(--coral);}
  .write-actions{display:flex; gap:10px;}
  .speak-btn{
    background:var(--cobalt); color:#fff; border:none; border-radius:10px; padding:13px 16px;
    font-size:18px; cursor:pointer; line-height:1;
  }
  .speak-btn:hover{background:var(--cobalt-deep);}

  /* Word Rain */
  .rain-track{
    position:relative; height:240px; border:2px dashed var(--paper-line); border-radius:14px;
    overflow:hidden; background:linear-gradient(180deg, var(--paper), #fff); margin-bottom:18px;
  }
  .rain-baseline{position:absolute; bottom:0; left:0; right:0; height:2px; background:var(--coral); opacity:.5;}
  .rain-word{
    position:absolute; left:50%; top:0; transform:translateX(-50%);
    font-family:'Fraunces', serif; font-weight:700; font-size:20px; color:var(--ink);
    background:#fff; border:2px solid var(--cobalt); border-radius:10px; padding:9px 18px;
    box-shadow:0 6px 14px var(--paper-shadow); white-space:nowrap;
  }
  .rain-hud{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; font-family:'JetBrains Mono', monospace; font-weight:700; font-size:14px;}
  .rain-lives{letter-spacing:2px;}

  /* Studio / Study */
  .study-intro{font-size:13.5px; color:var(--text-onDark-muted); margin-bottom:18px; max-width:520px;}
  .study-toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  .study-list{display:flex; flex-direction:column; gap:10px;}
  .study-row{
    display:flex; align-items:center; gap:14px; background:#fff; border:2px solid var(--paper-line);
    border-radius:14px; padding:14px 16px; transition:border-color .15s ease; color:var(--ink);
  }
  .study-row.playing{border-color:var(--lemon); background:rgba(255,201,60,0.15);}
  .study-row .speak-btn.small{padding:9px 12px; font-size:15px; flex-shrink:0;}
  .study-it{font-family:'Fraunces', serif; font-weight:700; font-size:19px; color:var(--ink);}
  .study-en{font-family:'DM Sans', sans-serif; font-size:14px; color:var(--cobalt-deep); font-weight:600;}
  .study-ex{font-family:'DM Sans', sans-serif; font-style:italic; font-size:12.5px; color:#8b8577; margin-top:2px;}

  /* Verifica / Test */
  .verify-review{margin:24px 0;}
  .verify-review-title{
    font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--coral); font-weight:700; margin-bottom:10px; text-align:center;
  }

let state = {
  points:0, streak:0, bestStreak:0,
  correctByCategory:{saluti:0, cibo:0, oggetti:0, numeri:0, colori:0, giorni:0, famiglia:0},
  stamps:{saluti:false, cibo:false, oggetti:false, numeri:false, colori:false, giorni:false, famiglia:false},
  readPassages:{},
  writingMastery:{},
};
let activeTab = "study";
let activeCat = "saluti";
let storageOK = true;

async function loadState(){
  try{
    const raw = localStorage.getItem('italian-progress');
    if(raw){
      const parsed = JSON.parse(raw);
      state = {
        ...state, ...parsed,
        correctByCategory: {...state.correctByCategory, ...(parsed.correctByCategory||{})},
        stamps: {...state.stamps, ...(parsed.stamps||{})},
        readPassages: {...state.readPassages, ...(parsed.readPassages||{})},
        writingMastery: {...state.writingMastery, ...(parsed.writingMastery||{})},
      };
    }
  }catch(e){ /* first run, or storage unavailable (e.g. private browsing) */ }
  renderStats();
}
function saveState(){
  try{
    localStorage.setItem('italian-progress', JSON.stringify(state));
  }catch(e){ storageOK = false; }
}

function renderStats(){
  document.getElementById('statPoints').textContent = state.points;
  document.getElementById('statStreak').textContent = state.streak;
  document.getElementById('statLevel').textContent = Math.floor(state.points/100)+1;
}

function addCorrect(cat, pts){
  state.points += pts;
  state.streak += 1;
  state.bestStreak = Math.max(state.bestStreak, state.streak);
  state.correctByCategory[cat] = (state.correctByCategory[cat]||0)+1;
  if(state.correctByCategory[cat] >= STAMP_THRESHOLD && !state.stamps[cat]){
    state.stamps[cat] = true;
  }
  renderStats();
  saveState();
}
function breakStreak(){
  state.streak = 0;
  renderStats();
  saveState();
}
function completeReading(id, pts){
  if(state.readPassages[id]) return false;
  state.readPassages[id] = true;
  state.points += pts;
  renderStats();
  saveState();
  return true;
}
function awardPoints(pts){
  state.points += pts;
  state.streak += 1;
  state.bestStreak = Math.max(state.bestStreak, state.streak);
  renderStats();
  saveState();
}

    const tile = document.createElement('button');
    tile.className = 'cat-tile' + (key===activeCat ? ' active':'');
    tile.style.setProperty('--tile-color', c.color);
    tile.innerHTML = `<span class="cat-tile-icon">${c.icon}</span><span class="cat-tile-label">${c.label}</span>`;

    bar.appendChild(tile);
  });
}
document.getElementById('tabs').addEventListener('click', e=>{
  const btn = e.target.closest('button[data-tab]');
  if(!btn) return;
  if(activeTab==='writing' && btn.dataset.tab!=='writing') cleanupWriting();
  if(activeTab==='study' && btn.dataset.tab!=='study') stopStudyPlay();
  if(activeTab==='reading' && btn.dataset.tab!=='reading') stopReadingPlay();
  activeTab = btn.dataset.tab;
  [...document.querySelectorAll('#tabs button')].forEach(b=>b.classList.toggle('active', b===btn));
  document.getElementById('catBar').style.display = (['passport','reading','grammar','builder'].includes(activeTab)) ? 'none' : 'flex';
  renderTab();
});

function renderTab(){
  if(activeTab==='study') renderStudy();
  else if(activeTab==='flash') renderFlash();
  else if(activeTab==='quiz') renderQuiz();
  else if(activeTab==='speed') renderSpeedIntro();
  else if(activeTab==='reading') renderReading();
  else if(activeTab==='grammar') renderGrammar();
  else if(activeTab==='builder') renderBuilder();
  else if(activeTab==='writing') renderWriting();
  else if(activeTab==='verify') renderVerify();
  else if(activeTab==='passport') renderPassport();
}

/* ---------- STUDIO / STUDY ---------- */
let studyPlaying = false;
let studyPlayTimeoutId = null;
function stopStudyPlay(){
  studyPlaying = false;
  if(studyPlayTimeoutId){ clearTimeout(studyPlayTimeoutId); studyPlayTimeoutId = null; }
  try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
  document.querySelectorAll('.study-row.playing').forEach(r=>r.classList.remove('playing'));
  const btn = document.getElementById('studyPlayAll');
  if(btn) btn.textContent = '▶ Ascolta tutto';
}
function renderStudy(){
  stopStudyPlay();
  const words = CATEGORIES[activeCat].words;
  const main = document.getElementById('main');
  main.innerHTML = `
    <p class="study-intro">Start here. Look at each word, tap 🔊 to hear it, and read the example sentence for context — no scoring, no pressure. Once these feel familiar, move on to Flashcard or Quiz to test yourself.</p>
    <div class="study-toolbar">
      <span class="write-progress" style="margin:0;">${words.length} parole in "${CATEGORIES[activeCat].label}"</span>
      <button class="btn btn-ink" id="studyPlayAll">▶ Ascolta tutto</button>
    </div>
    <div class="study-list" id="studyList">
      ${words.map((w,i)=>`
        <div class="study-row" data-i="${i}">
          <button class="speak-btn small" data-i="${i}" title="Listen">🔊</button>
          <div>
            <div class="study-it">${w.it}</div>
            <div class="study-en">${w.en}</div>
            <div class="study-ex">"${w.ex}"</div>
          </div>
        </div>`).join('')}
    </div>`;

  main.querySelectorAll('.speak-btn.small').forEach(btn=>{
    btn.onclick = ()=>{
      stopStudyPlay();
      speakItalian(words[Number(btn.dataset.i)].it);
    };
  });

  document.getElementById('studyPlayAll').onclick = ()=>{
    if(studyPlaying){ stopStudyPlay(); return; }
    studyPlaying = true;
    document.getElementById('studyPlayAll').textContent = '⏹ Ferma';
    let idx = 0;
    const playNext = ()=>{
      if(!studyPlaying || idx >= words.length){ stopStudyPlay(); return; }
      document.querySelectorAll('.study-row.playing').forEach(r=>r.classList.remove('playing'));
      const row = main.querySelector(`.study-row[data-i="${idx}"]`);
      if(row) row.classList.add('playing');
      speakItalian(words[idx].it);
      const pause = Math.max(1600, words[idx].it.length*130);
      studyPlayTimeoutId = setTimeout(()=>{ idx += 1; playNext(); }, pause);
    };
    playNext();
  };
}

/* ---------- QUIZ ---------- */
let quizWord = null;
let quizAnswered = false;
function pickQuizWord(){
  const words = CATEGORIES[activeCat].words;
  quizWord = words[Math.floor(Math.random()*words.length)];
  quizAnswered = false;
}
function buildOptions(correctWord){
  const pool = CATEGORIES[activeCat].words.filter(w=>w.it!==correctWord.it);
  const shuffled = pool.sort(()=>Math.random()-0.5).slice(0,3);
  const opts = [...shuffled.map(w=>w.en), correctWord.en];
  return opts.sort(()=>Math.random()-0.5);
}
function renderQuiz(){
  pickQuizWord();
  const main = document.getElementById('main');
  const opts = buildOptions(quizWord);
  main.innerHTML = `
    <div class="quiz-box">
      <div class="quiz-prompt">What does this mean?</div>
      <div class="quiz-word">${quizWord.it}</div>
      <div class="options" id="quizOpts">
        ${opts.map(o=>`<button class="opt" data-val="${o}">${o}</button>`).join('')}
      </div>
      <div class="feedback-row">
        <span class="streak-badge">🔥 striscia: ${state.streak}</span>
        <button class="btn btn-ink" id="quizNext" style="display:none;">Next word →</button>
      </div>
    </div>`;
  document.getElementById('quizOpts').addEventListener('click', e=>{
    const btn = e.target.closest('.opt');
    if(!btn || quizAnswered) return;
    quizAnswered = true;
    const val = btn.dataset.val;
    const isCorrect = val === quizWord.en;
    [...document.querySelectorAll('.opt')].forEach(o=>{
      o.disabled = true;
      if(o.dataset.val === quizWord.en) o.classList.add('correct');
      else if(o===btn) o.classList.add('wrong');
    });
    if(isCorrect) addCorrect(activeCat, 5); else breakStreak();
    document.getElementById('quizNext').style.display = 'inline-block';
  });
  document.getElementById('quizNext').onclick = renderQuiz;
}

      <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:${(speedTimeLeft/60)*100}%"></div></div>
      <span class="timer-num" id="timerNum">${speedTimeLeft}s</span>
    </div>
    <div class="quiz-box">
      <div class="quiz-prompt">Quick! What does this mean?</div>
      <div class="quiz-word">${speedWord.it}</div>
      <div class="options" id="speedOpts">
        ${opts.map(o=>`<button class="opt" data-val="${o}">${o}</button>`).join('')}
      </div>
    </div>`;
  document.getElementById('speedOpts').addEventListener('click', e=>{
    const btn = e.target.closest('.opt');
    if(!btn) return;
    const isCorrect = btn.dataset.val === speedWord.en;

  });
}
function updateTimerUI(){
  const fill = document.getElementById('timerFill');
  const num = document.getElementById('timerNum');
  if(fill) fill.style.width = ((speedTimeLeft/60)*100)+'%';

function endSpeedRound(){

    <div class="results">

/* ---------- READING / LETTURA ---------- */
let activePassage = READINGS[0].id;
let readingPlaying = false;
let readingPlayTimeoutId = null;
function stopReadingPlay(){
  readingPlaying = false;
  if(readingPlayTimeoutId){ clearTimeout(readingPlayTimeoutId); readingPlayTimeoutId = null; }
  try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
  document.querySelectorAll('.rline.playing').forEach(r=>r.classList.remove('playing'));
  const btn = document.getElementById('readingPlayAll');
  if(btn) btn.textContent = '▶ Ascolta il paragrafo';
}
function renderReading(){
  stopReadingPlay();
  const main = document.getElementById('main');
  const picker = READINGS.map(p=>`
    <button class="chip ${p.id===activePassage?'active':''}" data-passage="${p.id}">${p.icon} ${p.title}</button>
  `).join('');
  const passage = READINGS.find(p=>p.id===activePassage);
  const already = !!state.readPassages[passage.id];
  const fullSentences = passage.lines.map(line => line.words.map(w=>w[0]).join(' '));

  const linesHtml = passage.lines.map((line, li)=>{
    const wordsHtml = line.words.map(pair=>
      `<span class="word-stack"><span class="wit">${pair[0]}</span><span class="wgloss">${pair[1].toLowerCase()}</span></span>`
    ).join('');
    return `
      <div class="rline" data-line="${li}">
        <div class="rline-controls">
          <button class="speak-btn small" data-line-speak="${li}" title="Listen to this sentence">🔊</button>
          <button class="translate-toggle" data-line="${li}">🔤 Full translation</button>
        </div>
        <div class="it-line-wrap">${wordsHtml}</div>
        <p class="en-line hidden" id="en-${li}">${line.en}</p>
      </div>`;
  }).join('');

  main.innerHTML = `
    <div class="passage-picker">${picker}</div>
    <div class="reading-card">
      <div class="reading-title">${passage.icon} ${passage.title}</div>
      <div class="reading-sub">${passage.sub.toUpperCase()}</div>
      <div class="reading-hint">Each word's meaning sits right underneath it. Tap 🔊 to hear a sentence, or 🔤 for the full English translation.</div>
      <div class="study-toolbar">
        <span></span>
        <button class="btn btn-ink" id="readingPlayAll">▶ Ascolta il paragrafo</button>
      </div>
      ${linesHtml}
      <div class="reading-footer">
        <span class="done-note">${already ? '✓ Letto — hai già guadagnato i punti' : ''}</span>
        <button class="btn ${already?'btn-ghost':'btn-lemon'}" id="markRead" ${already?'disabled':''}>
          ${already ? 'Completato' : 'Ho letto questo! (+10 punti)'}
        </button>
      </div>
    </div>`;

  // category-style picker for passages
  main.querySelectorAll('[data-passage]').forEach(btn=>{
    btn.onclick = ()=>{ activePassage = btn.dataset.passage; renderReading(); };
  });

  // per-sentence listen
  main.querySelectorAll('[data-line-speak]').forEach(btn=>{
    btn.onclick = ()=>{
      stopReadingPlay();
      speakItalian(fullSentences[Number(btn.dataset.lineSpeak)]);
    };
  });

  // sentence translate toggle
  main.querySelectorAll('.translate-toggle').forEach(btn=>{
    btn.onclick = ()=>{
      const target = document.getElementById('en-'+btn.dataset.line);
      target.classList.toggle('hidden');
    };
  });

  // whole-passage playback
  document.getElementById('readingPlayAll').onclick = ()=>{
    if(readingPlaying){ stopReadingPlay(); return; }
    readingPlaying = true;
    document.getElementById('readingPlayAll').textContent = '⏹ Ferma';
    let idx = 0;
    const playNext = ()=>{
      if(!readingPlaying || idx >= fullSentences.length){ stopReadingPlay(); return; }
      document.querySelectorAll('.rline.playing').forEach(r=>r.classList.remove('playing'));
      const row = main.querySelector(`.rline[data-line="${idx}"]`);
      if(row) row.classList.add('playing');
      speakItalian(fullSentences[idx]);
      const pause = Math.max(1800, fullSentences[idx].length*140);
      readingPlayTimeoutId = setTimeout(()=>{ idx += 1; playNext(); }, pause);
    };
    playNext();
  };

  const markBtn = document.getElementById('markRead');
  if(markBtn && !already){
    markBtn.onclick = ()=>{
      completeReading(passage.id, 10);
      renderReading();
    };
  }
}

/* ---------- SENTENCE BUILDER / COSTRUISCI ---------- */
let builderIdx = -1;
let builderBank = []; // [{text, used}]
let builderBuilt = []; // indices into builderBank
function pickBuilderSentence(){
  let next;
  do{ next = Math.floor(Math.random()*SENTENCES.length); }while(next===builderIdx && SENTENCES.length>1);
  builderIdx = next;
  const words = SENTENCES[builderIdx].it;
  builderBank = words.map(w=>({text:w, used:false}))
                      .sort(()=>Math.random()-0.5);
  builderBuilt = [];
}
function renderBuilder(){
  if(builderIdx===-1) pickBuilderSentence();
  const ex = SENTENCES[builderIdx];
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="builder-card">
      <div class="builder-prompt">Build this sentence in Italian</div>
      <div class="builder-en">${ex.en}</div>
      <div class="builder-built" id="builtRow">
        ${builderBuilt.length===0 ? '<span class="placeholder">Tap words below to build the sentence…</span>' :
          builderBuilt.map(i=>`<button class="word-chip" data-i="${i}">${builderBank[i].text}</button>`).join('')}
      </div>
      <div class="builder-bank" id="bankRow">
        ${builderBank.map((w,i)=>`<button class="bank-chip" data-i="${i}" ${w.used?'disabled':''}>${w.text}</button>`).join('')}
      </div>
      <div class="builder-actions">
        <span class="builder-msg" id="builderMsg"></span>
        <div style="display:flex; gap:10px;">
          <button class="btn btn-ghost" id="builderSkip">Skip</button>
          <button class="btn btn-ink" id="builderCheck">Check</button>
        </div>
      </div>
    </div>`;

  main.querySelectorAll('#bankRow .bank-chip').forEach(btn=>{
    btn.onclick = ()=>{
      const i = Number(btn.dataset.i);
      if(builderBank[i].used) return;
      builderBank[i].used = true;
      builderBuilt.push(i);
      renderBuilder();
    };
  });
  main.querySelectorAll('#builtRow .word-chip').forEach(btn=>{
    btn.onclick = ()=>{
      const i = Number(btn.dataset.i);
      builderBank[i].used = false;
      builderBuilt = builderBuilt.filter(idx=>idx!==i);
      renderBuilder();
    };
  });
  document.getElementById('builderSkip').onclick = ()=>{ pickBuilderSentence(); renderBuilder(); };
  document.getElementById('builderCheck').onclick = ()=>{
    const attempt = builderBuilt.map(i=>builderBank[i].text).join(' ');
    const correct = ex.it.join(' ');
    const row = document.getElementById('builtRow');
    const msg = document.getElementById('builderMsg');
    if(attempt === correct){
      row.classList.add('correct');
      msg.textContent = 'Perfetto! ✓';
      msg.className = 'builder-msg ok';
      awardPoints(6);
      setTimeout(()=>{ pickBuilderSentence(); renderBuilder(); }, 900);
    } else {
      row.classList.add('wrong');
      msg.textContent = 'Not quite — try rearranging.';
      msg.className = 'builder-msg bad';
      breakStreak();
    }
  };
}

/* ---------- WRITING / SCRITTURA ---------- */
let writingSubTab = 'classic';

function masteryGet(cat, word){ return (state.writingMastery[cat] && state.writingMastery[cat][word]) || 0; }
function masterySet(cat, word, val){
  if(!state.writingMastery[cat]) state.writingMastery[cat] = {};
  state.writingMastery[cat][word] = val;
  saveState();
}
function normalizeAnswer(s){ return s.trim().toLowerCase().replace(/\s+/g,' '); }

function renderWriting(){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="write-subnav" id="writeSubnav">
      <button data-sub="classic" class="${writingSubTab==='classic'?'active':''}">✍️ Classico</button>
      <button data-sub="rain" class="${writingSubTab==='rain'?'active':''}">🌧️ Pioggia di Parole</button>
      <button data-sub="dictation" class="${writingSubTab==='dictation'?'active':''}">🔊 Dettato</button>
    </div>
    <div id="writeArea"></div>`;
  document.getElementById('writeSubnav').addEventListener('click', e=>{
    const btn = e.target.closest('button[data-sub]');
    if(!btn) return;
    if(writingSubTab==='rain') cleanupRain();
    writingSubTab = btn.dataset.sub;
    renderWriting();
  });
  if(writingSubTab==='classic') renderClassicWriting();
  else if(writingSubTab==='rain') renderWordRain();
  else if(writingSubTab==='dictation') renderDictation();
}

function cleanupWriting(){
  cleanupRain();
  try{ window.speechSynthesis && window.speechSynthesis.cancel(); }catch(e){}
}

/* --- Classic drill --- */
let classicWord = null;
function pickClassicWord(){
  const words = CATEGORIES[activeCat].words;
  const unmastered = words.filter(w => masteryGet(activeCat, w.it) < 3);
  const pool = unmastered.length ? unmastered : words;
  classicWord = pool[Math.floor(Math.random()*pool.length)];
}
function renderClassicWriting(){
  if(!classicWord || !CATEGORIES[activeCat].words.includes(classicWord)) pickClassicWord();
  const words = CATEGORIES[activeCat].words;
  const masteredCount = words.filter(w => masteryGet(activeCat, w.it) >= 3).length;
  const dots = masteryGet(activeCat, classicWord.it);
  const area = document.getElementById('writeArea');
  area.innerHTML = `
    <div class="write-progress">Parole padroneggiate: ${masteredCount} / ${words.length}</div>
    <div class="write-card">
      <div class="write-prompt">Write this word in Italian</div>
      <div class="write-target">${classicWord.en}</div>
      <div class="mastery-dots">
        ${[0,1,2].map(i=>`<span class="${i<dots?'filled':''}"></span>`).join('')}
      </div>
      <div class="write-row">
        <input class="write-input" id="classicInput" type="text" autocomplete="off" placeholder="Scrivi qui...">
        <button class="btn btn-ink" id="classicCheck">Controlla</button>
      </div>
      <div class="write-feedback" id="classicFeedback"></div>
    </div>`;
  const input = document.getElementById('classicInput');
  const target = normalizeAnswer(classicWord.it);
  input.addEventListener('input', ()=>{
    const val = normalizeAnswer(input.value);
    if(val.length===0){ input.classList.remove('ok-so-far','bad-so-far'); return; }
    const soFarOK = target.startsWith(val);
    input.classList.toggle('ok-so-far', soFarOK);
    input.classList.toggle('bad-so-far', !soFarOK);
  });
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') checkClassic(); });
  document.getElementById('classicCheck').onclick = checkClassic;
  input.focus();

  function checkClassic(){
    const val = normalizeAnswer(input.value);
    const fb = document.getElementById('classicFeedback');
    if(val === target){
      const prev = masteryGet(activeCat, classicWord.it);
      const next = Math.min(prev+1, 3);
      masterySet(activeCat, classicWord.it, next);
      awardPoints(prev<3 ? 5 : 2);
      fb.textContent = next>=3 ? 'Perfetto — parola padroneggiata! ✓' : 'Giusto! ✓';
      fb.className = 'write-feedback ok';
      setTimeout(()=>{ pickClassicWord(); renderClassicWriting(); }, 800);
    } else {
      masterySet(activeCat, classicWord.it, 0);
      breakStreak();
      fb.textContent = `Non proprio — la risposta era "${classicWord.it}". Riprova.`;
      fb.className = 'write-feedback bad';
      input.classList.add('bad-so-far');
    }
  }
}

/* --- Word Rain --- */
let rainActive = false, rainScore = 0, rainLives = 3, rainWord = null, rainCaught = false;
let rainIntervalId = null, rainTimeoutId = null;
function cleanupRain(){
  if(rainIntervalId){ clearInterval(rainIntervalId); rainIntervalId = null; }
  if(rainTimeoutId){ clearTimeout(rainTimeoutId); rainTimeoutId = null; }
}
function renderWordRain(){
  const area = document.getElementById('writeArea');
  if(!rainActive){
    area.innerHTML = `
      <div class="start-screen">
        <h2>Pioggia di Parole 🌧️</h2>
        <p>An English word falls — type its Italian translation before it hits the bottom. Three lives, go as long as you can.</p>
        <button class="btn btn-lemon" id="rainStart">Start</button>
      </div>`;
    document.getElementById('rainStart').onclick = ()=>{
      rainScore = 0; rainLives = 3; rainActive = true;
      nextRainWord();
    };
    return;
  }
  // resume an in-progress round (e.g. after switching tabs away and back)
  nextRainWord();
}
function nextRainWord(){
  cleanupRain();
  const words = CATEGORIES[activeCat].words;
  rainWord = words[Math.floor(Math.random()*words.length)];
  rainCaught = false;
  const duration = Math.max(5500, rainWord.it.length*650);
  const area = document.getElementById('writeArea');
  area.innerHTML = `
    <div class="rain-hud">
      <span>⭐ ${rainScore}</span>
      <span class="rain-lives">${'❤️'.repeat(rainLives)}${'🤍'.repeat(3-rainLives)}</span>
    </div>
    <div class="rain-track" id="rainTrack">
      <div class="rain-word" id="rainWordEl" style="top:0%;">${rainWord.en}</div>
      <div class="rain-baseline"></div>
    </div>
    <div class="write-row">
      <input class="write-input" id="rainInput" type="text" autocomplete="off" placeholder="Scrivi la traduzione italiana...">
    </div>
    <div class="write-feedback" id="rainFeedback"></div>`;
  const input = document.getElementById('rainInput');
  const wordEl = document.getElementById('rainWordEl');
  input.focus();
  const startTime = Date.now();
  rainIntervalId = setInterval(()=>{
    const elapsed = Date.now() - startTime;
    const pct = Math.min(92, (elapsed/duration)*92);
    wordEl.style.top = pct + '%';
    if(elapsed >= duration && !rainCaught){
      missRain();
    }
  }, 50);
  input.addEventListener('input', ()=>{
    if(normalizeAnswer(input.value) === normalizeAnswer(rainWord.it)){
      catchRain();
    }
  });
}
function catchRain(){
  if(rainCaught) return;
  rainCaught = true;
  cleanupRain();
  rainScore += 1;
  awardPoints(5);
  const fb = document.getElementById('rainFeedback');
  if(fb){ fb.textContent = 'Preso! ✓'; fb.className = 'write-feedback ok'; }
  rainTimeoutId = setTimeout(()=>{ if(rainActive) nextRainWord(); }, 500);
}
function missRain(){
  cleanupRain();
  rainLives -= 1;
  breakStreak();
  if(rainLives <= 0){
    endRain();
  } else {
    const fb = document.getElementById('rainFeedback');
    if(fb){ fb.textContent = `Persa! Era "${rainWord.it}".`; fb.className = 'write-feedback bad'; }
    rainTimeoutId = setTimeout(()=>{ if(rainActive) nextRainWord(); }, 900);
  }
}
function endRain(){
  rainActive = false;
  const area = document.getElementById('writeArea');
  area.innerHTML = `
    <div class="results">
      <div class="hint">GAME OVER</div>
      <div class="big">${rainScore}</div>
      <p style="color:var(--text-onDark-muted);">words caught</p>
      <button class="btn btn-lemon" id="rainAgain">Play again</button>
    </div>`;
  document.getElementById('rainAgain').onclick = renderWordRain;
}

/* --- Dictation --- */
let dictWord = null;
function speakItalian(text){
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'it-IT';
    u.rate = 0.85;
    window.speechSynthesis.speak(u);
  }catch(e){ /* speech synthesis unavailable */ }
}
function pickDictWord(){
  const words = CATEGORIES[activeCat].words;
  dictWord = words[Math.floor(Math.random()*words.length)];
}
function renderDictation(){
  if(!dictWord || !CATEGORIES[activeCat].words.includes(dictWord)) pickDictWord();
  const supported = ('speechSynthesis' in window);
  const area = document.getElementById('writeArea');
  area.innerHTML = `
    <div class="write-card">
      <div class="write-prompt">Listen, then type what you hear</div>
      ${!supported ? '<div class="write-feedback bad">Audio is not supported in this browser — try Chrome or Safari.</div>' : ''}
      <div class="write-row">
        <button class="speak-btn" id="dictSpeak" title="Listen">🔊</button>
        <input class="write-input" id="dictInput" type="text" autocomplete="off" placeholder="Scrivi quello che senti...">
        <button class="btn btn-ink" id="dictCheck">Controlla</button>
      </div>
      <div class="write-feedback" id="dictFeedback"></div>
    </div>`;
  document.getElementById('dictSpeak').onclick = ()=> speakItalian(dictWord.it);
  const input = document.getElementById('dictInput');
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') checkDict(); });
  document.getElementById('dictCheck').onclick = checkDict;
  input.focus();
  if(supported) speakItalian(dictWord.it);

  function checkDict(){
    const fb = document.getElementById('dictFeedback');
    if(normalizeAnswer(input.value) === normalizeAnswer(dictWord.it)){
      awardPoints(5);
      fb.textContent = 'Esatto! ✓';
      fb.className = 'write-feedback ok';
      setTimeout(()=>{ pickDictWord(); renderDictation(); }, 800);
    } else {
      breakStreak();
      fb.textContent = `Era "${dictWord.it}" — riascolta e riprova.`;
      fb.className = 'write-feedback bad';
    }
  }
}

/* ---------- VERIFICA / TEST ---------- */
let verifyStarted = false;
let verifyQueue = [];
let verifyIdx = 0;
let verifyResults = [];

function shuffleArr(arr){ return [...arr].sort(()=>Math.random()-0.5); }

function startVerify(customWords){
  const words = customWords || CATEGORIES[activeCat].words;
  verifyQueue = shuffleArr(words).map(w => ({ word:w, type: Math.random()<0.5 ? 'mc' : 'write' }));
  verifyIdx = 0;
  verifyResults = [];
  verifyStarted = true;
  renderVerify();
}
function recordVerify(word, correct){
  verifyResults.push({ word, correct });
}
function renderVerify(){
  const main = document.getElementById('main');
  if(!verifyStarted){
    const words = CATEGORIES[activeCat].words;
    main.innerHTML = `
      <div class="start-screen">
        <h2>Verifica 📝</h2>
        <p>A quick, low-pressure test on all ${words.length} words in "${CATEGORIES[activeCat].label}" — mixed meaning and writing questions. At the end you'll see exactly which ones to review.</p>
        <button class="btn btn-lemon" id="verifyStart">Start test</button>
      </div>`;
    document.getElementById('verifyStart').onclick = ()=> startVerify();
    return;
  }
  if(verifyIdx >= verifyQueue.length){ renderVerifyResults(); return; }
  const q = verifyQueue[verifyIdx];
  if(q.type==='mc') renderVerifyMC(q); else renderVerifyWrite(q);
}
function renderVerifyMC(q){
  const main = document.getElementById('main');
  const opts = buildOptions(q.word);
  main.innerHTML = `
    <div class="write-progress">Domanda ${verifyIdx+1} / ${verifyQueue.length}</div>
    <div class="quiz-box">
      <div class="quiz-prompt">What does this mean?</div>
      <div class="quiz-word">${q.word.it}</div>
      <div class="options" id="verifyOpts">
        ${opts.map(o=>`<button class="opt" data-val="${o}">${o}</button>`).join('')}
      </div>
      <div class="feedback-row">
        <span class="streak-badge">🔥 striscia: ${state.streak}</span>
        <button class="btn btn-ink" id="verifyNext" style="display:none;">Avanti →</button>
      </div>
    </div>`;
  let answered = false;
  main.querySelectorAll('#verifyOpts .opt').forEach(btn=>{
    btn.onclick = ()=>{
      if(answered) return;
      answered = true;
      const isCorrect = btn.dataset.val === q.word.en;
      main.querySelectorAll('.opt').forEach(o=>{
        o.disabled = true;
        if(o.dataset.val===q.word.en) o.classList.add('correct');
        else if(o===btn) o.classList.add('wrong');
      });
      if(isCorrect) awardPoints(4); else breakStreak();
      recordVerify(q.word, isCorrect);
      document.getElementById('verifyNext').style.display = 'inline-block';
    };
  });
  document.getElementById('verifyNext').onclick = ()=>{ verifyIdx += 1; renderVerify(); };
}
function renderVerifyWrite(q){
  const main = document.getElementById('main');
  main.innerHTML = `
    <div class="write-progress">Domanda ${verifyIdx+1} / ${verifyQueue.length}</div>
    <div class="write-card">
      <div class="write-prompt">Write this word in Italian</div>
      <div class="write-target">${q.word.en}</div>
      <div class="write-row">
        <input class="write-input" id="verifyInput" type="text" autocomplete="off" placeholder="Scrivi qui...">
        <button class="btn btn-ink" id="verifyCheck">Controlla</button>
      </div>
      <div class="write-feedback" id="verifyFeedback"></div>
      <button class="btn btn-ghost" id="verifyNext2" style="display:none; margin-top:12px;">Avanti →</button>
    </div>`;
  const input = document.getElementById('verifyInput');
  input.focus();
  let answered = false;
  function check(){
    if(answered) return;
    answered = true;
    const isCorrect = normalizeAnswer(input.value) === normalizeAnswer(q.word.it);
    const fb = document.getElementById('verifyFeedback');
    if(isCorrect){ fb.textContent = 'Giusto! ✓'; fb.className = 'write-feedback ok'; awardPoints(4); }
    else{ fb.textContent = `Era "${q.word.it}".`; fb.className = 'write-feedback bad'; breakStreak(); }
    recordVerify(q.word, isCorrect);
    document.getElementById('verifyNext2').style.display = 'inline-block';
  }
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') check(); });
  document.getElementById('verifyCheck').onclick = check;
  document.getElementById('verifyNext2').onclick = ()=>{ verifyIdx += 1; renderVerify(); };
}
function renderVerifyResults(){
  const main = document.getElementById('main');
  const correctCount = verifyResults.filter(r=>r.correct).length;
  const missed = verifyResults.filter(r=>!r.correct).map(r=>r.word);
  main.innerHTML = `
    <div class="results">
      <div class="hint">TEST COMPLETATO</div>
      <div class="big">${correctCount}/${verifyResults.length}</div>
      <p style="color:var(--text-onDark-muted);">corrette in "${CATEGORIES[activeCat].label}"</p>
    </div>
    ${missed.length>0 ? `
    <div class="verify-review">
      <div class="verify-review-title">Parole da ripassare</div>
      <div class="verify-list">
        ${missed.map(w=>`<div class="verify-item"><span class="verify-it">${w.it}</span><span class="verify-en">${w.en}</span></div>`).join('')}
      </div>
    </div>` : `<p style="text-align:center; color:var(--basil); font-weight:600;">Tutte corrette! 🎉</p>`}
    <div class="builder-actions" style="justify-content:center; gap:12px; margin-top:22px;">
      ${missed.length>0 ? `<button class="btn btn-coral" id="verifyRetryMissed">Ripeti gli errori (${missed.length})</button>` : ''}
      <button class="btn btn-ink" id="verifyRestart">Rifai il test</button>
    </div>`;
  if(missed.length>0){
    document.getElementById('verifyRetryMissed').onclick = ()=> startVerify(missed);
  }
  document.getElementById('verifyRestart').onclick = ()=>{ verifyStarted = false; renderVerify(); };
}

/* ---------- PASSPORT / PROGRESS ---------- */
function renderPassport(){
  const main = document.getElementById('main');
  const cells = Object.keys(CATEGORIES).map(key=>{
    const c = CATEGORIES[key];
    const count = state.correctByCategory[key]||0;
    const earned = state.stamps[key];
    return `
      <div class="stamp-cell ${earned?'earned':''}">
        <div class="mini-emoji">${c.icon}</div>
        <div class="cat-name">${c.label}</div>
        <div class="progress-txt">${Math.min(count,STAMP_THRESHOLD)} / ${STAMP_THRESHOLD}</div>
        <div class="stamp">TIMBRATO<br>✓</div>
      </div>`;
  }).join('');
  main.innerHTML = `
    <div class="passport">
      <div class="passport-head">
        <div>
          <div class="pt">Passaporto Linguistico</div>
          <h2>I Tuoi Progressi</h2>
        </div>
        <div class="pt" style="text-align:right;">miglior striscia<br><span style="font-size:20px; color:var(--lemon);">${state.bestStreak}</span></div>
      </div>
      <div class="stamps-grid">${cells}</div>
    </div>
    <p style="text-align:center; font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--text-onDark-muted); margin-top:16px;">
      Get ${STAMP_THRESHOLD} correct answers in a category (flashcards, quiz, or speed round) to earn its stamp.
    </p>`;
}

/* ---------- INIT ---------- */
(async function init(){
  buildCatBar();
  await loadState();
  renderTab();
})();
</script>
